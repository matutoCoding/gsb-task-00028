<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>超前支护方案取舍台</title>
<style>
:root{
  --ink:#1f2a33; --sub:#5b6b78; --line:#d8e0e6; --bg:#eef3f6;
  --card:#ffffff; --accent:#1f6f8b; --accent2:#2e8bab;
  --good:#1b7a43; --good-bg:#e6f5ec;
  --warn:#c0392b; --warn-bg:#fdecea; --warn-deep:#922b21;
  --gold:#9a6b12; --gold-bg:#fdf3dd;
  --freeze:#34506b; --freeze-bg:#e8eef4;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
}
header{
  background:linear-gradient(100deg,#16384a,#1f6f8b);
  color:#fff; padding:14px 22px; display:flex; align-items:center;
  justify-content:space-between; flex-wrap:wrap; gap:10px;
}
header h1{font-size:19px;margin:0;letter-spacing:1px}
header .meta{font-size:12.5px;opacity:.92;display:flex;gap:14px;flex-wrap:wrap}
header .meta b{font-weight:600}
.layout{
  display:grid; grid-template-columns:minmax(0,1fr) 400px;
  gap:16px; padding:16px 22px 30px; align-items:start;
}
@media(max-width:980px){.layout{grid-template-columns:1fr}}
.panel{
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  padding:14px 16px; box-shadow:0 1px 3px rgba(20,45,60,.06);
}
.panel h2{
  font-size:15px; margin:0 0 10px; display:flex; align-items:center; gap:8px;
}
.panel h2 .tag{font-size:11px;font-weight:400;color:var(--sub)}
.config{
  display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px;
  margin-bottom:14px;
}
@media(max-width:900px){.config{grid-template-columns:repeat(2,1fr)}}
.config label{font-size:12px;color:var(--sub);display:block;margin-bottom:3px}
.config input{width:100%}
input[type=number],input[type=date]{
  padding:6px 8px; border:1px solid var(--line); border-radius:6px;
  font-size:13px; font-family:inherit; background:#fff; color:var(--ink);
}
input[type=number]:focus,input[type=date]:focus{outline:2px solid #b7d9e6;border-color:var(--accent2)}
input:disabled{background:#f2f5f7;color:#8a97a1}
/* ---- 方案行 ---- */
.rank-badge{
  width:24px;height:24px;border-radius:50%;background:#e7eef2;color:#41555f;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;flex:none;
}
.rank-badge.r1{background:var(--gold);color:#fff}
.scheme{
  border:1px solid var(--line); border-radius:10px; padding:12px 14px;
  margin-bottom:10px; background:#fff; transition:border-color .15s,background .15s;
}
.scheme.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(31,111,139,.15)}
.scheme.danger{
  background:var(--warn-bg); border-color:#e6a39d;
}
.scheme.danger .rank-badge.r1{background:var(--warn)}
.scheme-head{display:flex;align-items:center;gap:10px}
.scheme-head .name{font-size:15px;font-weight:700}
.pill{
  font-size:11px;padding:2px 8px;border-radius:20px;white-space:nowrap;
}
.pill.cheapest{background:var(--gold-bg);color:var(--gold)}
.pill.redflag{background:var(--warn);color:#fff}
.pill.frozen{background:var(--freeze-bg);color:var(--freeze)}
.pill.unpicked{background:#eceff1;color:#6a7882}
.pill.over{background:#fbe1dc;color:var(--warn-deep)}
.scheme-grid{
  display:grid; grid-template-columns:repeat(3,1fr) 1.2fr 1fr;
  gap:10px; margin-top:10px; align-items:end;
}
@media(max-width:720px){.scheme-grid{grid-template-columns:repeat(2,1fr)}}
.field label{display:block;font-size:11.5px;color:var(--sub);margin-bottom:3px}
.calc{background:#f6f9fb;border:1px dashed #cfdbe2;border-radius:8px;padding:8px 10px}
.calc .num{font-size:17px;font-weight:700;color:var(--accent)}
.calc.danger .num{color:var(--warn)}
.calc small{display:block;color:var(--sub);font-size:11px;margin-top:1px}
.scheme-foot{
  margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
button{
  font-family:inherit; cursor:pointer; border-radius:7px; font-size:13px;
  padding:7px 14px; border:1px solid var(--accent); background:var(--accent);
  color:#fff; transition:filter .1s,opacity .1s;
}
button:hover{filter:brightness(1.07)}
button.ghost{background:#fff;color:var(--accent)}
button.danger-ghost{background:#fff;color:var(--warn);border-color:var(--warn)}
button.warn-solid{background:var(--warn);border-color:var(--warn)}
button:disabled{opacity:.45;cursor:not-allowed;filter:none}
button.mini{padding:3px 9px;font-size:12px;border-radius:6px}
.hint{font-size:11.5px;color:var(--sub)}
.hint.warn{color:var(--warn-deep)}
.edit-selected-note{
  margin-top:8px;font-size:12px;color:var(--warn-deep);
  background:#fbeee8;border:1px solid #eccdbe;border-radius:6px;padding:5px 9px;
  display:none;
}
.scheme.selected.editable .edit-selected-note{display:block}
.frozen-strip{
  margin-top:10px;background:var(--freeze-bg);border:1px solid #c9d7e2;
  border-radius:8px;padding:9px 11px;font-size:12.5px;color:var(--freeze);
  display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;
}
.frozen-strip .fr-label{color:#5e7388;font-size:11.5px}
.frozen-strip .fr-reason{grid-column:1 / -1;border-top:1px dashed #c3d0da;padding-top:6px}
.edit-toggle{margin-left:auto}
/* ---- 评分栏 ---- */
.score-block{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:10px;background:#fcfdfe}
.score-block.conflict{border-color:#e39189}
.sb-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.sb-head .sb-name{font-weight:700;font-size:13.5px}
.score-row{display:grid;grid-template-columns:88px 1fr auto;gap:8px;align-items:center;padding:3px 0}
.score-row .dim{font-size:12.5px;color:#3c4d59}
.stars{display:flex;gap:4px}
.stars button{
  width:27px;height:27px;padding:0;border-radius:5px;border:1px solid #c9d4db;
  background:#fff;color:#8294a0;font-weight:600;
}
.stars button.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
.score-row.conflict .stars button{border-color:#e39189}
.cell-actions{display:flex;gap:4px;align-items:center}
.cell-actions .local{font-size:11px;color:var(--warn)}
.cell-actions .revert{
  border:1px solid #d5b5b0;background:#fff;color:var(--warn);
  padding:1px 7px;font-size:11px;border-radius:5px;
}
.score-panel-locked{opacity:.65}
.sb-meta{font-size:11px;color:var(--sub);margin-left:auto}
.sb-history{margin-top:5px;font-size:11.5px;color:var(--sub)}
.sb-history b{color:var(--ink)}
.conflict-banner{
  display:none;background:#fdecea;border:1px solid #e6a39d;color:var(--warn-deep);
  border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:10px;
}
.conflict-banner.show{display:block}
.conflict-banner b{color:var(--warn)}
@keyframes colFlash{
  0%{background:#fdecea}
  25%{background:#fff0ee}
  50%{background:#fdecea}
  75%{background:#fff0ee}
  100%{background:var(--card)}
}
#rightPanel.flash{animation:colFlash 1.1s ease 2}
/* ---- 顶部状态条 ---- */
.statusbar{
  display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:12px;
  background:#f6f9fb;border:1px solid #d7e2e9;border-radius:8px;padding:9px 13px;font-size:13px;
}
.statusbar .k{color:var(--sub)}
.statusbar .v{font-weight:700}
.lock-banner{
  display:none;background:var(--warn-bg);border:1px solid #e6a39d;color:var(--warn-deep);
  border-radius:8px;padding:9px 13px;font-size:13px;margin-bottom:12px;
}
.lock-banner.show{display:block}
.freeze-banner{
  display:none;background:var(--freeze-bg);border:1px solid #c9d7e2;color:var(--freeze);
  border-radius:8px;padding:9px 13px;font-size:13px;margin-bottom:12px;
}
.freeze-banner.show{display:block}
/* ---- 台账 ---- */
.ledger{margin-top:16px}
.ledger-item{border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:8px;background:#fcfdfe}
.ledger-item .li-head{font-size:12.5px;margin-bottom:7px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.li-type{font-weight:700}
.li-when{color:var(--sub);font-size:11.5px;margin-left:auto}
.ba-grid{display:grid;grid-template-columns:1fr 24px 1fr;gap:8px;align-items:stretch}
.ba-card{border-radius:7px;padding:7px 10px;font-size:12px}
.ba-card.before{background:#f5f1ea;border:1px solid #e3d8c4}
.ba-card.after{background:#eaf4ee;border:1px solid #c2dfcd}
.ba-arrow{display:flex;align-items:center;justify-content:center;color:var(--sub)}
.ba-card .ba-title{font-size:11px;color:var(--sub);margin-bottom:3px}
.ba-card table{border-collapse:collapse;width:100%}
.ba-card td{font-size:11.5px;padding:1px 4px}
.ba-card td:first-child{color:var(--sub);white-space:nowrap}
.empty{color:var(--sub);font-size:12.5px;padding:6px 2px}
footer{padding:0 22px 26px;color:var(--sub);font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
/* ---- 模态 / toast ---- */
.modal-mask{
  display:none;position:fixed;inset:0;background:rgba(20,35,45,.45);
  align-items:center;justify-content:center;z-index:50;
}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:20px;width:min(460px,92vw);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal h3{margin:0 0 6px;font-size:16px}
.modal p.sub{margin:0 0 12px;color:var(--sub);font-size:12.5px}
.modal label{display:block;font-size:12.5px;color:var(--sub);margin:10px 0 4px}
.modal input,.modal textarea{width:100%;font-family:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:7px}
.modal textarea{min-height:72px;resize:vertical}
.modal-foot{display:flex;justify-content:flex-end;gap:9px;margin-top:15px}
#toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%);
  background:#24323d;color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .25s;z-index:80;max-width:88vw;
}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>超前支护方案取舍台</h1>
  <div class="meta">
    <span>窗口编号 <b id="cidLabel">—</b></span>
    <span id="monthLabel"></span>
  </div>
</header>
<div class="layout">
  <main>
    <section class="panel">
      <h2>工程口径 <span class="tag">改总价/工期的全局参数</span></h2>
      <div class="config" id="configRow"></div>
      <div class="statusbar" id="statusBar"></div>
      <div class="lock-banner" id="lockBanner"></div>
      <div class="freeze-banner" id="freezeBanner"></div>
    </section>

    <section class="panel" style="margin-top:14px">
      <h2>支护型式 <span class="tag">按总价从低到高自动排位</span></h2>
      <div id="schemeList"></div>
    </section>

    <section class="panel ledger">
      <h2>撤选/退回台账 <span class="tag">改前改后挨着摆</span></h2>
      <div id="ledgerList"></div>
    </section>
  </main>

  <aside class="panel" id="rightPanel">
    <h2>评分板 <span class="tag">塌方风险 / 到货迟缓 / 班组熟练度（1–5）</span></h2>
    <div class="conflict-banner" id="conflictBanner"></div>
    <div id="scoreBlocks"></div>
  </aside>
</div>

<footer>
  <span>双窗口同开本页即可对写评分：先落笔算数，后落的一整栏闪动提示对不上，把分改回一致即可解除。</span>
  <button class="ghost mini" id="resetBtn" style="border-color:#b8c4cc;color:#5b6b78">清台重开（演练用）</button>
</footer>

<div class="modal-mask" id="modalMask">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <p class="sub" id="modalSub"></p>
    <label for="modalReason">选定理由（撤回后需重新填写）</label>
    <textarea id="modalReason" placeholder="例：本段围岩为 V 级破碎带，拱顶易掉块，小导管性价比合适……"></textarea>
    <div class="modal-foot">
      <button class="ghost" id="modalCancel">取消</button>
      <button id="modalOk">确认选定</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
"use strict";
/* ================= 常量 ================= */
const TYPES = [
  {id:"bolt",  name:"系统锚杆"},
  {id:"pipe",  name:"超前小导管"},
  {id:"shed",  name:"管棚"},
];
const DIMS = [
  {id:"risk",    name:"塌方风险"},
  {id:"delay",   name:"材料到货迟缓"},
  {id:"skill",   name:"班组熟练度"},
];
const STORE = "gsb00028_state_v1";
const SCORE_STORE = "gsb00028_scores_v1";
const CHANNEL = "gsb00028_scores";
const UNDO_KEY = "gsb00028_undo_v1";
const CID_KEY = "gsb00028_cid";
const todayStr = () => {
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
};
const mmdd = ts => ts.slice(5);
const ym = ts => ts.slice(0,7);
const nowMonth = () => todayStr().slice(0,7);
const yuan = n => "¥" + Math.round(n).toLocaleString("zh-CN");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
));
/* ================= 窗口身份 ================= */
let cid = sessionStorage.getItem(CID_KEY);
if(!cid){
  cid = Math.random().toString(16).slice(2,6).toUpperCase();
  sessionStorage.setItem(CID_KEY,cid);
}
document.getElementById("cidLabel").textContent = cid;

/* ================= 主状态 ================= */
function defaultState(){
  return {
    config:{
      entryDate: todayStr(),   // 进场日期
      length: 48,              // 需要支护长度(m)
      cap: 12,                 // 当月台车班数上限
      shiftsPerDay: 2,         // 每天台车班数
    },
    params:{
      bolt:{price:90,  advance:3.0, occ:1},
      pipe:{price:160, advance:2.5, occ:1},
      shed:{price:420, advance:4.0, occ:2},
    },
    selected: null,            // 被点选的型式 id
    reason: "",                // 当前选定理由
    frozen: null,              // 冻住时的快照 {date, total, cycles, days, scores:{...}}
    picks: {},                 // id -> ["YYYY-MM-DD", ...] 每次选中日期
    ledger: [],                // 撤选/退回台账
  };
}
let state;
try{ state = JSON.parse(localStorage.getItem(STORE)) || defaultState(); }
catch(e){ state = defaultState(); }
// 兼容缺字段
{
  const d = defaultState();
  state.config = Object.assign(d.config, state.config||{});
  state.params = Object.assign(d.params, state.params||{});
  state.picks = state.picks || {};
  state.ledger = state.ledger || [];
}
const saveState = () => localStorage.setItem(STORE, JSON.stringify(state));

/* ================= 评分文档（跨窗口共享） ================= */
function defaultScores(){
  const cells = {};
  TYPES.forEach(t => DIMS.forEach(dm => {
    cells[t.id+":"+dm.id] = {v:3, rev:0, by:null};
  }));
  return {rev:0, writer:null, cells};
}
let scores;
try{ scores = JSON.parse(localStorage.getItem(SCORE_STORE)); }
catch(e){ scores = null; }
if(!scores || !scores.cells){
  scores = defaultScores();
  localStorage.setItem(SCORE_STORE, JSON.stringify(scores));
}
const saveScores = () => localStorage.setItem(SCORE_STORE, JSON.stringify(scores));

/* 每格撤销栈（仅本窗口）: {key -> [v,...]} */
let undo;
try{ undo = JSON.parse(sessionStorage.getItem(UNDO_KEY)) || {}; }
catch(e){ undo = {}; }
const saveUndo = () => sessionStorage.setItem(UNDO_KEY, JSON.stringify(undo));
const undoPush = (key,v) => {
  (undo[key] = undo[key]||[]).push(v);
  saveUndo();
};
const undoPop = key => {
  const arr = undo[key]||[];
  const v = arr.pop();
  saveUndo();
  return v;
};
const undoKeys = () => Object.keys(undo).filter(k => (undo[k]||[]).length);

/* 本窗口对每格的"待定写入"（输掉后留在界面上的值） */
let pending = {};

/* 冲突标记（输掉的格子集合） */
let conflictCells = new Set();
let conflictMsg = "";
/* ================= 计算 ================= */
const num = (v,d=0) => { const n = parseFloat(v); return Number.isFinite(n) ? n : d; };
function calcRow(id){
  const p = state.params[id];
  const len = num(state.config.length,0);
  const price = num(p.price,0), adv = num(p.advance,0), occ = num(p.occ,0);
  const cycles = adv>0 ? Math.ceil(len/adv) : 0;
  const total = price * len;
  const days = state.config.shiftsPerDay>0 ? cycles*occ/state.config.shiftsPerDay : 0;
  return {id, price, adv, occ, cycles, total, days};
}
function viewRows(){
  return TYPES.map(t => {
    const live = calcRow(t.id);
    const fro = state.frozen && state.selected===t.id;
    return Object.assign(live, fro ? {
      total:state.frozen.total, days:state.frozen.days, cycles:state.frozen.cycles, frozen:true,
    } : {frozen:false});
  }).sort((a,b) => a.total-b.total);
}
const usedShifts = () => state.selected
  ? num(state.params[state.selected].occ,0)
  : 0;
const remainingShifts = () => num(state.config.cap,0) - usedShifts();
const isLocked = () => remainingShifts() <= 0 && !!state.selected;

/* ================= 评分抢写协议 ================= */
function scoreVal(typeId,dimId){
  const c = scores.cells[typeId+":"+dimId];
  return c ? c.v : 3;
}
function effectiveVal(typeId,dimId){
  const key = typeId+":"+dimId;
  if(pending[key] != null) return pending[key];
  if(state.frozen && state.frozen.scores[key]!=null) return state.frozen.scores[key];
  return scoreVal(typeId,dimId);
}
/* 尝试落笔；返回 true=先写成功，false=慢了一拍 */
function applyScore(key,value,isRevert){
  if(state.selected){ toast("已选定型式，评分与进场日期已冻住"); return; }
  if(isLocked()){ toast("本月台车班数已填满，板子已锁住"); return; }
  const cur = scores.cells[key] || {v:3,rev:0,by:null};
  const mine = (cur.by === cid);
  // 后写一方把分点回权威值 → 本格对不上解除（笔仍归先落的一方）
  if(cur.by && !mine && value===cur.v){
    delete pending[key];
    conflictCells.delete(key);
    if(conflictCells.size===0) conflictMsg = "";
    render();
    return;
  }
  // 别人先落过笔 → 对不上
  if(cur.by && !mine){
    pending[key] = value;
    conflictCells.add(key);
    conflictMsg = `格子「${keyName(key)}」已由窗口 ${cur.by} 先落笔（${cur.v} 分），你这边的 ${value} 分没算数；把分改回 ${cur.v} 即可解除。`;
    if(!isRevert) undoPush(key,cur.v);
    saveUndo();
    if(conflictCells.size===0) conflictMsg="";
    render(); flashRight();
    return;
  }
  // 自己持有：改回一致的分值即归还笔
  if(mine && pending[key]==null && value===cur.v && scores.writer===cid){
    cur.by = null;
    if(!Object.values(scores.cells).some(c=>c.by===cid)) scores.writer = null;
    saveScores(); postScore({kind:"release",key}); render();
    return;
  }
  if(!isRevert) undoPush(key,cur.v);
  cur.v = value; cur.rev += 1; cur.by = cid;
  scores.rev += 1; scores.writer = cid;
  delete pending[key];
  conflictCells.delete(key);
  saveScores();
  postScore({kind:"write",key});
  render();
}
/* 撤销一格到本窗口上一次的分值 */
function revertCell(key){
  const prev = undoPop(key);
  if(prev==null){
    // 没有本地历史就按"改回权威值"处理
    const cur = scores.cells[key]||{v:3};
    delete pending[key]; conflictCells.delete(key); render(); return;
  }
  delete pending[key];
  applyScore(key,prev,true);
}
/* 整块改回：冲突的格子全部回到权威值 */
function revertBlock(typeId){
  DIMS.forEach(dm=>{
    const key = typeId+":"+dm.id;
    if(conflictCells.has(key)){
      delete pending[key]; conflictCells.delete(key);
    }
  });
  if(![...conflictCells].some(k=>k.startsWith(typeId+":"))){
    render();
  } else render();
}
const keyName = key => {
  const [t,d] = key.split(":");
  return `${(TYPES.find(x=>x.id===t)||{}).name||t}·${(DIMS.find(x=>x.id===d)||{}).name||d}`;
};

/* ================= 跨窗口 ================= */
let bc = null;
try{ bc = new BroadcastChannel(CHANNEL); }catch(e){ bc = null; }
function postScore(msg){
  try{ bc && bc.postMessage(Object.assign({cid,ts:Date.now()},msg)); }catch(e){}
}
if(bc){
  bc.onmessage = ev => {
    const msg = ev.data||{};
    if(msg.cid === cid) return;
    if(!(msg.kind==="write"||msg.kind==="release")) return;
    // 重新读 localStorage 里的文档（同源同源存储）
    let remote;
    try{ remote = JSON.parse(localStorage.getItem(SCORE_STORE)); }catch(e){ return; }
    if(!remote || remote===scores) { receiveScores(remote,msg); return; }
    receiveScores(remote,msg);
  };
}
window.addEventListener("storage", ev => {
  if(ev.key !== SCORE_STORE) return;
  let remote; try{ remote = JSON.parse(ev.newValue); }catch(e){ return; }
  receiveScores(remote,{kind:"storage"});
});
function receiveScores(remote,msg){
  if(!remote) return;
  // 文档没有任何变化就直接返回：绝不回写 localStorage，避免两个窗口借 storage 事件互相乒乓
  if(JSON.stringify(remote)===JSON.stringify(scores)) return;
  // 检查我手里的"待定写入"格子是否已被对方落笔
  Object.keys(pending).forEach(key=>{
    const rc = remote.cells[key];
    if(rc && rc.by && rc.by!==cid){
      conflictCells.add(key);
    }
  });
  // 笔是按格子持有的：不同格子互不干扰。仅当我占有的某一格在对方文档里被改写成别人的，
  // 才算同格抢笔（同 rev 同刻），按 cid 字典序仲裁，输家闪栏。
  let stolen = null;
  if(remote.rev >= scores.rev && remote.writer && remote.writer!==cid){
    Object.keys(remote.cells).forEach(k=>{
      const mineCell = scores.cells[k] && scores.cells[k].by===cid;
      const theirs = remote.cells[k];
      if(mineCell && theirs.by && theirs.by!==cid && theirs.rev >= scores.cells[k].rev){
        stolen = {key:k, by:theirs.by};
      }
    });
  }
  if(stolen && stolen.by < cid){
    scores = remote;
    conflictCells.add(stolen.key);
    delete pending[stolen.key];
    conflictMsg = `窗口 ${stolen.by} 与你几乎同时落笔「${keyName(stolen.key)}」，按先落笔规则以它的分值为准。`;
    render(); flashRight();
    return;
  }
  if(stolen){
    // 我赢：再广播一次促成收敛（不写 localStorage、不触发 storage 事件）
    postScore({kind:"write"});
    return;
  }
  scores = remote;
  render();
}
function flashRight(){
  const el = document.getElementById("rightPanel");
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}
/* ================= 选定 / 撤选 ================= */
function snapshotOf(id,kind){
  const r = calcRow(id);
  const sc = {};
  TYPES.forEach(t => DIMS.forEach(dm=>{
    sc[t.id+":"+dm.id] = scoreVal(t.id,dm.id);
  }));
  return {
    kind, id,
    when: todayStr(), reason: state.reason||"",
    price:r.price, advance:r.adv, occ:r.occ,
    cycles:r.cycles, total:r.total, days:r.days,
    config:{
      length:num(state.config.length,0),
      cap:num(state.config.cap,0),
      shiftsPerDay:num(state.config.shiftsPerDay,0),
    },
  };
}
function scoreSnapshot(){
  const sc = {};
  TYPES.forEach(t => DIMS.forEach(dm=>{ sc[t.id+":"+dm.id] = scoreVal(t.id,dm.id); }));
  return sc;
}
function confirmSelect(id){
  if(isLocked()){ toast("本月台车班数已填满，板子已锁住"); return; }
  const r = calcRow(id);
  if(num(r.occ,0) > remainingShifts()){
    if(!confirm(`${TYPES.find(t=>t.id===id).name} 单循环占 ${r.occ} 班，超过本月剩余 ${remainingShifts()} 班。仍要选定吗？`)) return;
  }
  const reason = document.getElementById("modalReason").value.trim();
  if(!reason){ toast("选定理由不能为空"); return; }
  const prevId = state.selected;
  const prevSnap = prevId ? snapshotOf(prevId,"switch-out") : null;
  state.selected = id;
  state.reason = reason;
  state.frozen = {
    date: state.config.entryDate,
    total: r.total, days: r.days, cycles: r.cycles,
    occ: r.occ, scores: scoreSnapshot(),
  };
  state.picks[id] = (state.picks[id]||[]).concat(todayStr());
  if(prevId && prevId!==id){
    state.ledger.unshift({
      kind:"switch", ts:Date.now(), date:todayStr(),
      out:prevSnap,
      in:snapshotOf(id,"switch-in"),
      reason,
    });
  } else {
    state.ledger.unshift({
      kind:"select", ts:Date.now(), date:todayStr(),
      in:snapshotOf(id,"select"), reason,
    });
  }
  pending = {}; conflictCells = new Set(); conflictMsg = "";
  editOpenId = null;
  saveState(); closeModal(); render();
  if(remainingShifts()<=0){
    toast("台车班数当月上限已填满，板子锁住");
  }
}
function withdrawSelect(){
  const id = state.selected;
  if(!id) return;
  const before = snapshotOf(id,"withdraw");
  state.ledger.unshift({
    kind:"withdraw", ts:Date.now(), date:todayStr(),
    before,
    after:{kind:"idle", id},
    reason: state.reason,
  });
  state.selected=null; state.reason=""; state.frozen=null;
  editOpenId = null;
  saveState(); render();
}
/* 改已选型式的单价/进尺 → 自动退回未选 */
function editSelectedParam(field,value){
  const id = state.selected;
  if(!id) return;
  const before = snapshotOf(id,"edit-back");
  const p = state.params[id];
  p[field] = value;
  const after = (() => { const r = calcRow(id); return Object.assign({kind:"params",id},r); })();
  state.ledger.unshift({
    kind:"editback", ts:Date.now(), date:todayStr(),
    before, after, reason:state.reason,
    field,
  });
  state.selected=null; state.reason=""; state.frozen=null;
  editOpenId = null;
  saveState(); render();
  toast("改动已选型式，自动退回未选，理由需重新填写");
}

document.addEventListener("input", e=>{
  const t = e.target;
  if(t.dataset.cfg){
    if(state.selected && t.dataset.cfg==="entryDate"){ return; }
    const key = t.dataset.cfg;
    state.config[key] = key==="entryDate" ? t.value : num(t.value, state.config[key]);
    saveState(); render();
  } else if(t.dataset.param){
    const id = t.dataset.param, tid = t.dataset.id;
    const val = num(t.value, state.params[tid][id]);
    if(state.selected===tid && editOpenId===tid){
      // 已选型式：改价/改进尺 → 退回未选
      editSelectedParam(id,val);
      return;
    }
    if(state.selected===tid) return; // 未解锁不生效
    state.params[tid][id] = val;
    saveState(); render();
  }
});

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-act],[data-score]");
  if(!t) return;
  if(t.dataset.score){
    applyScore(t.dataset.key, parseInt(t.dataset.score,10));
    return;
  }
  const act = t.dataset.act;
  if(act==="select"){ openSelect(t.dataset.id); }
  else if(act==="withdraw"){
    if(confirm("撤掉当前选定？占用的台车班数会释放，分数解冻。")) withdrawSelect();
  }
  else if(act==="toggle-edit"){
    editOpenId = editOpenId===state.selected ? null : state.selected;
    render();
  }
  else if(act==="revert-cell"){
    revertCell(t.dataset.key);
  }
  else if(act==="revert-block"){
    const id = t.dataset.id;
    DIMS.forEach(dm=>{
      const key = id+":"+dm.id;
      if(conflictCells.has(key) || pending[key]!=null){
        delete pending[key]; conflictCells.delete(key);
      }
    });
    conflictMsg = "";
    render();
    toast("已改回另一窗口落下的分值");
  }
});

});

/* 清台 */
$("#resetBtn").addEventListener("click",()=>{
  if(!confirm("清台会清掉本浏览器内的方案参数、选定、评分与台账（共享评分也会重置），确定？")) return;
  localStorage.removeItem(STORE);
  localStorage.removeItem(SCORE_STORE);
  sessionStorage.removeItem(UNDO_KEY);
  location.reload();
});

/* toast */
let toastTimer=null;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 2600);
}

render();
</script>
</body>
